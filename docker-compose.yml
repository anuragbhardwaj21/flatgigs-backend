services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flatgigs-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flatgigs
      POSTGRES_PASSWORD: flatgigs
      POSTGRES_DB: flatgigs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flatgigs -d flatgigs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flatgigs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: flatgigs-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flatgigs:flatgigs@postgres:5432/flatgigs?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ingest_data:/app/data/raw

  ingest:
    build: .
    container_name: flatgigs-ingest
    profiles:
      - tools
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flatgigs:flatgigs@postgres:5432/flatgigs?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ingest_data:/app/data/raw
    command: ["sh", "scripts/docker/ingest.sh"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  ingest_data:
